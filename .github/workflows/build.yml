name: Build image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bare semver to tag the image with, e.g. 0.2.0"
        required: true
        type: string
      sha:
        description: "Commit SHA to build. Defaults to the tip of the dispatch ref."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'${VERSION}' is not a bare semver (x.y.z)"; exit 1; }

      # The point of the `sha` input: build the commit the version job actually
      # bumped, not whatever main happens to point at when this dispatch is picked
      # up (which would be racy for a workflow_dispatch's default ref tip).
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Compute tag components
        id: vars
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor _patch <<< "$VERSION"
          {
            echo "version=${VERSION}"
            echo "majorminor=${major}.${minor}"
            echo "sha=$(git rev-parse HEAD)"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version arrives as a workflow input, not a refs/tags/v* ref, so
      # `type=semver` patterns would never fire — metadata-action reads those off
      # the git ref only. type=raw is the correct construction here. type=sha is
      # avoided too: it derives from github.sha, which is the dispatch ref's tip
      # rather than inputs.sha.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.majorminor }}
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Buildx's own inline provenance turns the pushed artifact into an index
          # with an extra unknown/unknown entry in the GHCR UI. Disabling it keeps
          # the digest a plain image manifest, which is also the cleanest subject
          # for the attestation step below.
          provenance: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Same image name, `-migrate` tag suffix. This publishes the `builder` stage —
      # the only one with the Prisma CLI and prisma/migrations/ available (the
      # `runner` stage above is a stripped Next.js standalone build, per
      # app/Dockerfile) — so `prisma migrate deploy` can run as a pull-only step on
      # a deploy host that only has a Compose file, not this repo checked out.
      - id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-migrate
            type=raw,value=${{ steps.vars.outputs.version }}-migrate
            type=raw,value=${{ steps.vars.outputs.majorminor }}-migrate
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}-migrate
          labels: |
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}

      - id: push-migrate
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile
          target: builder
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          # Same cache scope as the runner build above: `deps`/`builder` layers are
          # identical between the two targets, so this reuses rather than
          # duplicates that work.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Attest build provenance (migrate image)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-migrate.outputs.digest }}
          push-to-registry: true
