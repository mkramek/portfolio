services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
    ports:
      - "5432:5432"
    volumes:
      - cv-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # One-off: applies committed migrations to a fresh/updated DB, then exits.
  # Uses the `builder` stage (not the final runner image) because that's the
  # only stage with the Prisma CLI and prisma/migrations/ available — the
  # runner stage is a stripped Next.js standalone build, per app/Dockerfile.
  migrate:
    build:
      context: app
      dockerfile: Dockerfile
      target: builder
    command: ["bunx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://cv:cv@postgres:5432/cv
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: app
      dockerfile: Dockerfile
    # Secrets/config (ADMIN_EMAIL, BETTER_AUTH_SECRET, MAIL_TRANSPORT, ...) come
    # from app/.env, copied from app/.env.example. DATABASE_URL/SMTP_HOST below
    # override that file's localhost-based defaults with in-network hostnames,
    # since this container reaches postgres/mailpit by service name, not localhost.
    env_file:
      - app/.env
    environment:
      DATABASE_URL: postgresql://cv:cv@postgres:5432/cv
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  cv-postgres:
